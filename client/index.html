<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Courier.exe</title>
  </head>

  <body>
    <div id="game-container"></div>
    <div id="direction-controls" aria-label="Controles de movimento">
      <button
        class="direction-button direction-up"
        data-direction="up"
        aria-label="Mover para cima"
      >
        &#9650;
      </button>
      <button
        class="direction-button direction-left"
        data-direction="left"
        aria-label="Mover para a esquerda"
      >
        &#9664;
      </button>
      <button
        class="direction-button direction-down"
        data-direction="down"
        aria-label="Mover para baixo"
      >
        &#9660;
      </button>
      <button
        class="direction-button direction-right"
        data-direction="right"
        aria-label="Mover para a direita"
      >
        &#9654;
      </button>
    </div>
    <button id="exit-house-button" type="button" aria-label="Sair da casa">
      Sair da casa
    </button>
    <script src="./js/phaser.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
