<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="COURIER.EXE" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <title>Courier.exe</title>
  </head>

  <body>
    <div id="intro-screen">
      <video
        id="intro-video"
        autoplay
        muted
        playsinline
        preload="auto"
        src="./assets/Contrail%20One(1).mp4"
      ></video>
      <audio
        id="intro-audio"
        preload="auto"
        src="./assets/YTDown.com_YouTube_Media_NeW2zunE4gw_VHS-insert-eject-sound_009_128k.mp3"
      ></audio>
    </div>
    <div id="game-container"></div>
    <div id="joystick" aria-label="Joystick de movimento" role="application">
      <div id="joystick-knob"></div>
      <div id="health-bar" aria-label="Vida do personagem">
        <span id="health-label">VIDA</span>
        <div
          id="health-track"
          role="progressbar"
          aria-label="Vida do personagem"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
        >
          <div id="health-fill"></div>
        </div>
      </div>
    </div>
    <section id="objectives-panel" aria-label="Senha">
      <code id="objective-password" aria-live="polite">Senha: ----</code>
    </section>
    <div id="terminal-modal" class="modal-backdrop" hidden>
      <section
        class="terminal-monitor"
        role="dialog"
        aria-modal="true"
        aria-labelledby="terminal-title"
      >
        <img
          class="terminal-machine"
          src="./assets/play.png"
          alt="Computador exibindo o código do terminal"
        />
        <div class="terminal-screen">
          <div class="terminal-window-controls" aria-hidden="true">
            <span>-</span><span>□</span><span>×</span>
          </div>
          <h2 id="terminal-title">MEMORIZE SEU CÓDIGO</h2>
          <div
            id="terminal-code"
            class="terminal-code"
            aria-label="Senha atual"
          ></div>
          <div class="terminal-logo" aria-hidden="true">
            COURIER<br /><span>EXE</span>
          </div>
        </div>
        <div class="terminal-stand" aria-hidden="true"></div>
        <button
          id="close-terminal-button"
          class="terminal-close"
          type="button"
          aria-label="Fechar tela do terminal"
        >
          FECHAR PC
        </button>
      </section>
    </div>
    <div id="password-modal" class="modal-backdrop" hidden>
      <form id="password-form" class="password-panel">
        <h2>DESBLOQUEAR PACOTE</h2>
        <p>Digite a senha exibida no PC.</p>
        <input
          id="password-input"
          inputmode="numeric"
          pattern="[0-9]{4}"
          maxlength="4"
          autocomplete="off"
          aria-label="Senha de quatro dígitos"
          required
        />
        <div class="password-actions">
          <button id="cancel-password-button" type="button">Cancelar</button>
          <button type="submit">Desbloquear</button>
        </div>
        <p id="password-error" class="password-error" aria-live="polite"></p>
      </form>
    </div>
    <script src="./assets/mqtt-client.js"></script>
    <script src="./js/phaser.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
